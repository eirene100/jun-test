<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>중3 영어 5~7과 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Layout: one-screen flashcard app — top filter bar, one flip card filling the middle, fixed nav bar at the bottom */
:root{
  --bg:#E9EDF2; --card:#FFFFFF; --ink:#1B2430; --muted:#5D6878; --line:#D3D9E1;
  --l5:#D9622B; --l6:#8A4FB5; --l7:#13857A;
  --ok:#1F8A4C; --again:#C2410C; --back:#F6F8FB;
  --font-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-en:"Literata", Georgia, "Times New Roman", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161D; --card:#1B222C; --ink:#E8EDF3; --muted:#9AA5B4; --line:#2E3845;
  --l5:#F08A55; --l6:#B488DA; --l7:#3FC2B2; --ok:#4BC27E; --again:#F2875A; --back:#151B23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161D; --card:#1B222C; --ink:#E8EDF3; --muted:#9AA5B4; --line:#2E3845;
  --l5:#F08A55; --l6:#B488DA; --l7:#3FC2B2; --ok:#4BC27E; --again:#F2875A; --back:#151B23; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.count b{color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px var(--font-ui);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:focus-visible,.navbtn:focus-visible,.mark:focus-visible,.stage:focus-visible{outline:3px solid var(--l7);outline-offset:2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}

.stage{flex:1;min-height:0;perspective:1400px;position:relative;margin-block:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:18px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.stage.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;box-sizing:border-box;padding:20px 20px 18px}
.front{background:var(--card)}
.back{background:var(--back);transform:rotateY(180deg)}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc);border-radius:18px 0 0 18px}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lesson{color:var(--lc);font-weight:700;letter-spacing:.04em}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:500}
.done{margin-left:auto;font-weight:500}
.done.ok{color:var(--ok)} .done.again{color:var(--again)}
.q{font-size:18px;font-weight:500;margin:16px 0 0;text-wrap:pretty}
.en{font-family:var(--font-en);font-size:18px;line-height:1.6;background:var(--back);border-radius:10px;padding:12px 14px;margin:12px 0 0;white-space:pre-line}
.back .en{background:var(--card)}
.opts{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.opts li{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--font-en);font-size:16.5px;line-height:1.45}
.opts li span{font-family:var(--font-ui);font-weight:700;color:var(--muted);flex:none}
.hint{margin-top:auto;padding-top:16px;text-align:center;font-size:13px;color:var(--muted)}
.alabel{font-size:13px;font-weight:700;color:var(--lc);letter-spacing:.06em;margin-top:16px}
.answer{font-family:var(--font-en);font-size:24px;font-weight:700;line-height:1.35;margin:4px 0 0;text-wrap:balance}
.ex{margin:14px 0 0;font-size:15.5px;line-height:1.65;text-wrap:pretty}
.ex em{font-style:normal;font-family:var(--font-en);font-weight:700}
.marks{display:flex;gap:8px;margin-top:auto;padding-top:16px}
.mark{flex:1;border:1.5px solid currentColor;background:transparent;border-radius:12px;padding:11px 8px;font:700 15px var(--font-ui);cursor:pointer}
.mark.ok{color:var(--ok)} .mark.again{color:var(--again)}

nav{display:flex;gap:10px;padding-block:6px calc(12px + env(safe-area-inset-bottom,0px))}
.navbtn{flex:1;border:none;border-radius:14px;padding:14px 8px;font:700 16px var(--font-ui);cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.navbtn.main{flex:1.4;background:var(--ink);color:var(--card);border-color:var(--ink)}
.navbtn:disabled{opacity:.4;cursor:default}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
@media (prefers-reduced-motion: reduce){.flip{transition:none}.bar i{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>중3 영어 5~7과 퀴즈</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="chips" role="group" aria-label="범위 선택">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체 50</button>
      <button class="chip" id="f-5" data-f="5" aria-pressed="false">5과</button>
      <button class="chip" id="f-6" data-f="6" aria-pressed="false">6과</button>
      <button class="chip" id="f-7" data-f="7" aria-pressed="false">7과</button>
      <button class="chip" id="f-again" data-f="again" aria-pressed="false">다시 볼 문제</button>
      <button class="chip" id="shuffle" aria-pressed="false">섞기</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <div class="stage" id="stage" tabindex="0" role="button" aria-label="카드를 눌러 정답 보기">
    <div class="flip">
      <section class="face front" id="front"></section>
      <section class="face back" id="back"></section>
    </div>
  </div>

  <nav>
    <button class="navbtn" id="prev">◀ 이전</button>
    <button class="navbtn main" id="flipbtn">정답 보기</button>
    <button class="navbtn" id="next">다음 ▶</button>
  </nav>
</div>

<script>
const L = {5:"Lesson 5 · The Team Behind the Team", 6:"Lesson 6 · Stories for All Time", 7:"Lesson 7 · Technology in Our Lives"};
const Q = [
/* ---------- Lesson 5 ---------- */
{u:5,t:"의사소통",q:"빈칸에 알맞은 말은?",en:"A: ______ do you exercise?\nB: I exercise once a week.",a:"How often",ex:"<em>How often ~?</em>은 '얼마나 자주 ~하니?'라는 빈도를 묻는 표현입니다. 대답은 once a week(일주일에 한 번), twice a week(두 번), three times a week(세 번), every day처럼 합니다."},
{u:5,t:"의사소통",q:"다음 중 의미가 나머지와 <b>다른</b> 것은?",opts:["I suggest you exercise more often.","You'd better exercise more often.","Why don't you exercise more often?","I'm sure you exercise more often."],a:"④ I'm sure you exercise more often.",ex:"①②③은 모두 '운동을 더 자주 하는 게 좋겠어'라는 <b>제안·충고</b> 표현입니다. ④는 '너는 분명 더 자주 운동한다'는 확신 표현이라 의미가 다릅니다."},
{u:5,t:"어휘",q:"다음 영영풀이에 해당하는 표현은?",en:"to become thin or damaged because of being used a lot",a:"wear out (닳다, 해지다)",ex:"본문: <em>the tires wear out easily in a high speed race</em> (고속 경주에서 타이어가 쉽게 닳는다). 예문: My shoes wear out quickly because I exercise every day."},
{u:5,t:"어휘",q:"빈칸에 알맞은 표현은? (흐름을) 계속 파악하다",en:"You need to ______ ______ ______ how much money you spend in a month.",a:"keep track of",ex:"<em>keep track of</em> = ~을 계속 파악하다, 기록하다. 본문: Since the pacer <em>keeps track of</em> the time, the runner can achieve his or her goal."},
{u:5,t:"어휘",q:"반의어 짝이 <b>잘못된</b> 것은?",opts:["possible – impossible","polite – impolite","formal – informal","patient – inpatient","visible – invisible"],a:"④ patient – inpatient",ex:"patient(참을성 있는)의 반의어는 <em>impatient</em>입니다. p, b, m으로 시작하는 단어 앞에는 보통 im-이 붙습니다(impossible, impolite, impatient). in-은 invisible, informal, indirect처럼 씁니다."},
{u:5,t:"문법",q:"괄호 안의 동사를 알맞은 형태로 바꾸세요.",en:"The girl ______ at the bus stop is my sister. (wait)",a:"waiting",ex:"'버스 정류장에서 기다리고 있는 소녀'처럼 명사를 뒤에서 꾸밀 때 <b>현재분사(-ing)</b>를 씁니다. 분사 뒤에 다른 말(at the bus stop)이 붙으면 명사 뒤에 놓습니다."},
{u:5,t:"문법",q:"어법상 알맞은 것은?",en:"The woman (wears / wearing / is wearing) glasses is my teacher.",a:"wearing",ex:"문장의 동사는 뒤의 <em>is</em>입니다. 동사가 두 개일 수 없으므로 The woman을 꾸미는 현재분사 <em>wearing</em>이 맞습니다. 본문: Pacers usually have flags or balloons <em>showing</em> their finish time."},
{u:5,t:"문법",q:"우리말을 영어로 바르게 옮긴 것은?<br>‘오늘은 어제만큼 바람이 분다.’",opts:["Today is as windy as yesterday.","Today is as windier as yesterday.","Today is windy as yesterday.","Today is so windy than yesterday."],a:"① Today is as windy as yesterday.",ex:"<em>as + 형용사/부사 원급 + as</em> = ~만큼 …한. as와 as 사이에는 비교급이 아니라 <b>원급</b>이 들어갑니다. 본문: They are <em>as important as</em> the players."},
{u:5,t:"본문",q:"마라톤에서 페이서(pacer)가 하는 일은?",opts:["They run to win the race.","They help other runners manage their race better.","They give runners water during the race.","They check the runners' shoes."],a:"② They help other runners manage their race better.",ex:"Pacers are experienced runners, and their job is to <em>help other runners manage their race better</em>. 마지막 문장도 기억하세요: pacers run but they don't run to win. They run for others."},
{u:5,t:"본문",q:"페이서가 들고 있는 깃발이나 풍선은 무엇을 보여 주나요? 영어로 답하세요.",a:"their finish time",ex:"Pacers usually have flags or balloons showing their <em>finish time</em>. 교과서 Read and Correct에서 'start time'으로 바꿔 틀린 문장을 만든 적이 있으니 주의하세요."},
{u:5,t:"본문",q:"마라톤을 4시간 안에 완주하고 싶은 주자는 어떻게 하면 되나요?",a:"follow the four-hour pacer",ex:"Runners can choose a pacer <em>depending on their target finish time</em>. 4시간이 목표인 주자는 4시간 페이서를 따라 달리면 됩니다."},
{u:5,t:"본문",q:"자동차 경주에서 pit은 무엇인가요?",a:"a place on the side of the race track",ex:"A pit is <em>a place on the side of the race track</em>, and drivers stop there several times during a race. 피트 크루의 주된 일은 차를 점검하고 타이어를 바꾸는 것입니다."},
{u:5,t:"본문",q:"자동차 경주에서 타이어 교체가 특히 중요한 이유는?",a:"Because the tires wear out easily in a high speed race.",ex:"Changing the tires is especially important <em>because the tires wear out easily in a high speed race</em>."},
{u:5,t:"본문",q:"다음 문장에서 본문 내용과 <b>틀린</b> 부분을 찾아 고치세요.",en:"A pit stop can be as short as 2 minutes, so the pit crew has to work in perfect harmony.",a:"2 minutes → 2 seconds",ex:"A pit stop can be as short as <em>2 seconds</em>, and there are as many as <em>20 members</em> on a crew. 숫자 두 개(2초, 20명)를 함께 외워 두세요."},
{u:5,t:"본문",q:"“Races are won in the pits.”가 뜻하는 것으로 알맞은 것은?",opts:["운전자만 주목받는다.","경주의 승패는 피트 크루의 작업에 달려 있다.","피트에서 경주가 시작된다.","타이어를 바꾸지 않아야 이긴다."],a:"② 경주의 승패는 피트 크루의 작업에 달려 있다.",ex:"The driver may get all the attention, but as people say, “Races are won in the pits.” 주목은 운전자가 받지만, 실제 승리는 피트 크루의 손에 달려 있다는 뜻입니다."},
{u:5,t:"본문",q:"등반가들이 셰르파를 고용하기 시작한 이유로 본문에 <b>없는</b> 것은?",opts:["They have good climbing skills.","They know their way around the mountains well.","They have little difficulty breathing high up in the mountains.","They can take pictures of climbers at the top."],a:"④ They can take pictures of climbers at the top.",ex:"셰르파는 등반 기술이 좋고, 산길을 잘 알며, 높은 곳에서도 숨쉬기가 거의 어렵지 않습니다(<em>have little difficulty breathing</em>). 그래서 Therefore, mountain climbers started to hire Sherpas. Sherpa라는 말은 네팔 동부에 사는 셰르파 부족(tribe)에서 왔습니다."},
{u:5,t:"본문",q:"셰르파가 ‘에베레스트의 보이지 않는 사람들(the invisible people of Mount Everest)’로 불리는 이유는?",a:"People often see a picture of only the climbers at the top of the mountain.",ex:"셰르파는 텐트를 치고(put up tents) 등반가의 짐을 들어 주며(carry climbers' bags) 정상까지 이끌지만, 사람들은 정상에 선 <b>등반가만 찍힌 사진</b>을 보기 때문에 '보이지 않는 사람들'이라 불립니다."},

/* ---------- Lesson 6 ---------- */
{u:6,t:"의사소통",q:"빈칸에 가장 알맞은 대답은?",en:"A: What's up?\nB: I won first prize in the English speech contest. I'm so excited.\nA: That's wonderful. ______",a:"Congratulations!",ex:"좋은 일에는 <em>Congratulations (on ~ing)!</em>로 축하합니다. 예: Congratulations on winning the gold medal."},
{u:6,t:"의사소통",q:"빈칸에 가장 알맞은 대답은?",en:"A: What's up?\nB: My smartphone is broken. I'm very upset.\nA: ______",opts:["Congratulations!","That's too bad. I'm sorry to hear that.","I'm glad to hear that.","That sounds great."],a:"② That's too bad. I'm sorry to hear that.",ex:"속상한 일에는 <em>I'm sorry to hear that.</em> / <em>That's too bad.</em>로 유감을 표현합니다."},
{u:6,t:"어휘",q:"본문에서 priceless의 뜻으로 알맞은 것은?",en:"A table which was a priceless piece of eighteenth-century English furniture.",opts:["값어치가 없는","값을 매길 수 없을 만큼 귀중한","값이 싼","가격표가 없는"],a:"② 값을 매길 수 없을 만큼 귀중한",ex:"자주 나오는 함정입니다. -less가 붙었지만 <em>priceless</em>는 '값이 없는'이 아니라 '너무 귀해서 값을 매길 수 없는'이라는 뜻입니다. 반면 careless(부주의한), endless(끝없는)는 '~이 없는'의 뜻입니다."},
{u:6,t:"어휘",q:"밑줄 친 단어의 뜻은?",en:"“This table is a reproduction. It's worth only a few pounds.”",a:"reproduction = 복제품, 모조품",ex:"re-(다시) + produce(만들다). Mr. Boggis는 진품 탁자를 보고 <b>복제품</b>이라고 거짓말을 했습니다. worth = ~의 가치가 있는."},
{u:6,t:"어휘",q:"빈칸에 알맞은 말을 고르세요. (careless / priceless / replay)",en:"______ drivers can cause accidents.",a:"Careless",ex:"careless = 부주의한. 다른 문장도 확인: Don't <em>replay</em> the music so many times. / The Louvre has a <em>priceless</em> collection of art."},
{u:6,t:"어휘",q:"다음 문장의 뜻을 쓰세요.",en:"People didn't know how valuable their things were, so Mr. Boggis took advantage of them.",a:"사람들은 자기 물건이 얼마나 귀한지 몰랐고, 그래서 보기스 씨는 그들을 이용했다.",ex:"<em>take advantage of</em> = ~을 (부당하게) 이용하다. <em>valuable</em> = 귀중한, 값비싼."},
{u:6,t:"문법",q:"괄호 안의 동사를 알맞은 형태로 바꾸세요.",en:"When I came home, everybody ______ to bed. (go)",a:"had gone",ex:"내가 집에 온 것(과거)보다 <b>더 먼저</b> 일어난 일은 <b>과거완료 had + p.p.</b>로 씁니다. 본문: When Mr. Boggis came back, the legs <em>had been cut off</em>."},
{u:6,t:"문법",q:"빈칸에 들어갈 말로 알맞은 것은?",en:"The table was ______ every dealer dreamed of.",opts:["that","which","what","who"],a:"③ what",ex:"관계대명사 <em>what</em>은 선행사를 품고 있어 '~하는 것'으로 해석합니다(= the thing which). 앞에 선행사가 없으므로 that/which는 쓸 수 없습니다."},
{u:6,t:"문법",q:"주어진 단어를 바르게 배열하세요.",en:"I like ( gave / what / me / Dad ).",a:"I like what Dad gave me.",ex:"what + 주어 + 동사 순서입니다. '나는 아빠가 나에게 준 것이 좋다.' 같은 원리: I read what he had written to me."},
{u:6,t:"문법",q:"빈칸에 <b>what</b>이 들어갈 수 <b>없는</b> 문장은?",opts:["This is exactly ______ I want.","We ate ______ Mom had cooked for us.","He told me ______ he had already seen the movie.","I haven't received ______ I ordered yet."],a:"③ He told me ______ he had already seen the movie.",ex:"③은 뒤 문장이 완전한 문장(he had already seen the movie)이므로 접속사 <em>that</em>이 들어갑니다. what 뒤에는 목적어나 주어가 빠진 불완전한 문장이 옵니다."},
{u:6,t:"문법",q:"괄호 안의 동사를 알맞은 형태로 바꾸세요.",en:"Since the movie was so sad, she couldn't help ______. (cry)",a:"crying",ex:"<em>can't help -ing</em> = ~하지 않을 수 없다. 본문: On his way to the car, Mr. Boggis <em>couldn't help smiling</em>."},
{u:6,t:"본문",q:"Mr. Boggis는 어떤 사람이고 무엇으로 유명했나요?",a:"an antique furniture dealer known for buying good things at a low price and selling them at a high price",ex:"런던의 골동품 가구상(<em>antique furniture dealer</em>)으로, 좋은 물건을 싸게 사서 비싸게 파는 것으로 알려져 있었습니다(<em>be known for</em>)."},
{u:6,t:"본문",q:"Mr. Boggis의 ‘비밀’로 알맞은 것은?",opts:["He bought furniture in London shops.","He went to small towns every Sunday and knocked on doors.","He made reproductions himself.","He asked his son to find furniture."],a:"② He went to small towns every Sunday and knocked on doors.",ex:"매주 일요일 작은 마을에 가서 문을 두드렸고, 사람들이 물건의 가치를 모르는 것을 이용해 아주 싸게 샀습니다."},
{u:6,t:"본문",q:"다음 문장이 본문 내용과 맞으면 T, 틀리면 F.",en:"Mr. Boggis almost fell over when he found an eighteenth-century English table in Rummins' kitchen.",a:"F (kitchen → living room)",ex:"부엌(kitchen)에는 아무것도 없었고, <em>living room</em>(거실)에서 탁자를 발견했습니다. 너무 흥분해서 거의 넘어질 뻔했죠(He was so excited that he almost fell over)."},
{u:6,t:"본문",q:"Mr. Boggis가 탁자를 사겠다며 댄 핑계는?",a:"The legs of his table at home were broken, so he would cut off the legs of this table and attach them to his.",ex:"“The legs of my table at home are broken. I can <em>cut off</em> the legs of your table and <em>attach</em> them to mine.” 이 거짓말이 결말의 반전으로 이어집니다."},
{u:6,t:"본문",q:"흥정 과정에서 Mr. Boggis의 최종 제안(final offer) 금액은?",opts:["ten pounds","fifteen pounds","thirty pounds","fifty pounds"],a:"③ thirty pounds",ex:"10파운드 → 15파운드 → (Rummins: 50파운드로 하자) → “Well, thirty. This is my final offer.” 순서까지 기억해 두세요."},
{u:6,t:"본문",q:"Bert와 Rummins가 탁자 다리를 자른 이유는?",a:"They thought what Mr. Boggis wanted was only the legs, and the table might not go in his car.",ex:"Bert는 탁자가 차에 안 들어가면 돈을 못 받을까 걱정했고, Rummins는 “<em>What he wants is only the legs.</em>”라며 다리만 잘라 주기로 했습니다. 그런데 Mr. Boggis가 진짜 원한 것은 탁자 전체였기 때문에, 돌아와서 너무 충격을 받아 아무 말도 못 했습니다."},

/* ---------- Lesson 7 ---------- */
{u:7,t:"의사소통",q:"방법을 묻는 말에 대한 응답으로 자연스러운 것은?",en:"A: Do you know how to return these books?\nB: ______",opts:["No, I don't like books.","Sure. First, insert the card. Then put the books in this box.","Yes, I returned them yesterday.","I really appreciate your help."],a:"② Sure. First, insert the card. Then put the books in this box.",ex:"<em>Do you know how to ~?</em>는 방법을 묻는 표현이고, 대답은 First, Then(Second), Last 순서로 절차를 설명합니다."},
{u:7,t:"의사소통",q:"“I really appreciate your help.”와 의미가 같은 것은?",opts:["Thank you so much for your help.","Can you help me?","I don't need your help.","I'm sorry to hear that."],a:"① Thank you so much for your help.",ex:"<em>appreciate</em> = 감사하다. 도움을 받은 뒤 고마움을 표현하는 말입니다."},
{u:7,t:"어휘",q:"다음 영영풀이에 해당하는 단어는?",en:"to say that something will happen in the future",a:"predict (예측하다)",ex:"본문: These results then can be used to make decisions or to <em>predict</em> the future. 비슷한 말 <em>forecast</em>(예보하다)도 함께 외우세요."},
{u:7,t:"어휘",q:"밑줄 친 trace의 뜻은?",en:"Almost everything that we do online leaves a trace.",a:"흔적, 자취",ex:"온라인에서 하는 거의 모든 일이 흔적을 남기기 때문에 데이터 양이 많아집니다. 블로그에 올린 사진(upload), 온라인 구매 기록(purchase)도 모두 빅데이터의 일부입니다."},
{u:7,t:"어휘",q:"빈칸에 알맞은 형태를 쓰세요. (help → -ful)",en:"Among the people who gave me help, John was the most ______.",a:"helpful",ex:"명사 + -ful = 형용사: <em>helpful, useful, meaningful</em>. 형용사 + -ly = 부사: <em>wisely, generally, possibly, regularly</em>. 본문: draw <em>meaningful</em> results / analyzed <em>wisely</em>."},
{u:7,t:"문법",q:"다음 분사구문과 의미가 같은 것은?",en:"Using various methods, experts analyze big data.",opts:["Because experts use various methods, ...","When experts use various methods, ...","Although experts use various methods, ...","If experts don't use various methods, ..."],a:"② When experts use various methods, ...",ex:"분사구문은 접속사와 주어를 생략하고 동사를 -ing로 바꾼 것입니다. 여기서는 '다양한 방법을 사용하여(사용할 때)'라는 뜻이 자연스럽습니다. 본문의 또 다른 분사구문: Big data is improving the performance of players, <em>making</em> sports more exciting."},
{u:7,t:"문법",q:"밑줄 친 부분을 분사구문으로 바꾸세요.",en:"While he waved his hand, he walked out of the house.",a:"Waving his hand, he walked out of the house.",ex:"① 접속사(While) 생략 → ② 주어가 같으면 주어(he) 생략 → ③ 동사를 -ing로(waved → Waving)."},
{u:7,t:"문법",q:"밑줄 친 as가 ‘~함에 따라’의 뜻으로 쓰인 것은?",opts:["As I told you, we will meet at 6:00.","As it was late at night, we went back home.","She got wiser as she got older.","Health professionals can forecast a disease just as weather experts forecast the weather."],a:"③ She got wiser as she got older.",ex:"접속사 as의 뜻: ① ~대로(As I told you) ② ~때문에(As it was late) ③ <b>~함에 따라</b>(as she got older) ④ ~처럼. 본문: <em>As</em> information and communication technology develops, the amount of data is getting much greater. (~함에 따라)"},
{u:7,t:"문법",q:"문장을 자연스럽게 완성하세요.",en:"As spring comes, ______.",opts:["it rained all day","it gets warmer and warmer","she went to bed early"],a:"② it gets warmer and warmer",ex:"'봄이 옴에 따라 점점 더 따뜻해진다.' 나머지 짝: As Jane was very tired, she went to bed early. / As the weather forecaster predicted, it rained all day."},
{u:7,t:"본문",q:"본문에서 말하는 빅데이터(big data)의 정의는?",a:"data sets that are very big and complex",ex:"Big data is <em>data sets that are very big and complex</em>. 그냥 모으는 것만으로는 충분하지 않고(Simply collecting data is not enough), 전문가가 분석(analyze)해야 합니다."},
{u:7,t:"본문",q:"다음 문장에서 본문 내용과 <b>틀린</b> 부분을 찾아 고치세요.",en:"As information and communication technology develops, the amount of data we have is getting much smaller than before.",a:"smaller → greater",ex:"데이터 양은 이전보다 훨씬 <em>많아지고(greater)</em> 있습니다. 이유: almost everything that we do online leaves a trace."},
{u:7,t:"본문",q:"빅데이터가 기업(companies)에 주는 도움은 무엇인가요?",a:"It helps them understand their customers' needs better and sell more products.",ex:"It helps companies <em>understand their customers' needs better</em> and helps them <em>sell more products</em>. 또 사람들이 교통 체증을 피하도록(avoid heavy traffic) 돕습니다. Its uses are endless(쓰임새가 끝이 없다)."},
{u:7,t:"본문",q:"건강 전문가들이 독감 확산을 예측할 때 분석하는 데이터 두 가지는?",a:"flu medicine sales and online searches about flu symptoms",ex:"독감철에는 사람들이 독감약을 더 많이 사고(buy more flu medicine), 독감 증상(symptoms)을 온라인에서 더 많이 검색합니다. 이 데이터를 잘 분석하면 독감의 확산(spread)을 예측할 수 있습니다."},
{u:7,t:"본문",q:"독일 국가대표 축구팀의 데이터베이스에 들어간 정보로 본문에 나온 것은?",opts:["선수들의 식단","각 선수가 얼마나 많이 뛰었는지와 얼마나 오래 공을 가지고 있었는지","관중 수","상대 팀 감독의 전략"],a:"② 각 선수가 얼마나 많이 뛰었는지와 얼마나 오래 공을 가지고 있었는지",ex:"the data included information about <em>how much each player ran</em> and <em>how long he had the ball</em>. 그 결과 2014년 월드컵에서 우승했습니다."},
{u:7,t:"본문",q:"경찰이 만드는 ‘범죄 다발 지역 지도(map of crime hot spots)’는 무엇을 알려 주나요?",a:"when and where crime is most likely to happen",ex:"범죄의 유형·시간·장소에 대한 빅데이터를 분석해 지도를 만들고, This map identifies <em>when and where crime is most likely to happen</em>. 경찰은 그 지역과 시간에 집중해(focus on) 추가 범죄를 예방합니다(prevent)."},
{u:7,t:"본문",q:"빅데이터의 미래에 대해 전문가들이 동의하는 것은?",a:"Big data will play a more and more important role in our lives.",ex:"Nobody knows for sure, but experts agree that big data will <em>play a more and more important role</em> in our lives. <em>play a role</em> = 역할을 하다."}
];

const stage=document.getElementById('stage'),front=document.getElementById('front'),back=document.getElementById('back');
const countEl=document.getElementById('count'),barEl=document.getElementById('bar');
const prevB=document.getElementById('prev'),nextB=document.getElementById('next'),flipB=document.getElementById('flipbtn');
Q.forEach((q,i)=>q.id=i+1);

let marks={};
try{marks=JSON.parse(localStorage.getItem('eng35-marks')||'{}')||{}}catch(e){marks={}}
function saveMarks(){try{localStorage.setItem('eng35-marks',JSON.stringify(marks))}catch(e){}}

let filter='all',list=Q.slice(),idx=0,shuffled=false;
const lc=u=>`var(--l${u})`;

function build(){
  if(filter==='all')list=Q.slice();
  else if(filter==='again')list=Q.filter(q=>marks[q.id]==='again');
  else list=Q.filter(q=>String(q.u)===filter);
  if(shuffled){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  idx=0;render();
}
function metaHTML(q){
  const m=marks[q.id];
  const done=m==='ok'?'<span class="done ok">✓ 맞음</span>':m==='again'?'<span class="done again">↺ 다시 볼 문제</span>':'';
  return `<div class="meta"><span class="lesson">L${q.u}</span><span class="tag">${q.t}</span><span>${q.id}번</span>${done}</div>`;
}
function render(){
  stage.classList.remove('flipped');flipB.textContent='정답 보기';
  const n=list.length;
  if(!n){
    front.style.setProperty('--lc','var(--line)');back.style.setProperty('--lc','var(--line)');
    front.innerHTML='<div class="empty">다시 볼 문제가 아직 없습니다.<br>카드 뒷면에서 “다시 볼래요”를 누르면 여기에 모입니다.</div>';
    back.innerHTML='';countEl.innerHTML='<b>0</b> / 0';barEl.style.width='0';
    prevB.disabled=nextB.disabled=flipB.disabled=true;return;
  }
  flipB.disabled=false;
  const q=list[idx];
  front.style.setProperty('--lc',lc(q.u));back.style.setProperty('--lc',lc(q.u));
  const opts=q.opts?`<ol class="opts">${q.opts.map((o,i)=>`<li><span>${'①②③④⑤'[i]}</span>${o}</li>`).join('')}</ol>`:'';
  const en=q.en?`<div class="en">${q.en}</div>`:'';
  front.innerHTML=`${metaHTML(q)}<p class="q">${q.q}</p>${en}${opts}<div class="hint">카드를 누르면 정답이 나와요 · 옆으로 밀면 다음 문제</div>`;
  back.innerHTML=`${metaHTML(q)}<div class="alabel">정답</div><p class="answer">${q.a}</p><p class="ex">${q.ex}</p>
    <div class="marks"><button class="mark again" id="m-again" data-m="again">↺ 다시 볼래요</button><button class="mark ok" id="m-ok" data-m="ok">✓ 맞았어요</button></div>`;
  front.scrollTop=0;back.scrollTop=0;
  countEl.innerHTML=`<b>${idx+1}</b> / ${n}`;
  barEl.style.width=((idx+1)/n*100)+'%';
  prevB.disabled=idx===0;nextB.disabled=idx===n-1;
}
function flip(){if(!list.length)return;const f=stage.classList.toggle('flipped');flipB.textContent=f?'문제 보기':'정답 보기'}
function go(d){const j=idx+d;if(j<0||j>=list.length)return;idx=j;render()}

stage.addEventListener('click',e=>{
  const m=e.target.closest('.mark');
  if(m){e.stopPropagation();const q=list[idx];marks[q.id]=m.dataset.m;saveMarks();
    if(filter==='again'&&m.dataset.m==='ok'){const keep=idx;list=Q.filter(x=>marks[x.id]==='again');idx=Math.min(keep,Math.max(list.length-1,0));render();return}
    if(idx<list.length-1)go(1);else render();return}
  flip();
});
stage.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
flipB.onclick=flip;prevB.onclick=()=>go(-1);nextB.onclick=()=>go(1);

let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1)}},{passive:true});

document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===c));build()});
document.getElementById('shuffle').onclick=function(){shuffled=!shuffled;this.setAttribute('aria-pressed',shuffled);this.textContent=shuffled?'섞음 ✓':'섞기';build()};

build();
</script>
